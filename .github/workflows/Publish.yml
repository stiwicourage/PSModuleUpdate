name: Publish Module

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  publish:
    uses: stiwicourage/powershell-ci/.github/workflows/publish.yml@0.2.0
    with:
      dependency-mode: isolated
      pester-required-version: '5.7.1'
      test-command: Test-NovaBuild
      release-continuous-integration: true
    secrets: inherit
